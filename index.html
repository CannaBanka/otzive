<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Відгуки</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      max-width: 760px;
      margin: 24px auto;
      padding: 0 18px 60px 18px;
      font-size: 16px;
      line-height: 1.5;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(118,33,255,0.12), transparent 8%), radial-gradient(800px 400px at 90% 90%, rgba(255,75,200,0.08), transparent 10%), #0b0710;
      color: #e9e6ef;
      transition: background 0.4s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #fff;
      text-shadow: 0 4px 18px rgba(128,0,255,0.12);
    }
    form input,
    form textarea,
    form select {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 15px 0;
      box-sizing: border-box;
      font-size: 1rem;
      border-radius: 8px;
      resize: vertical;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      color: #eee;
      backdrop-filter: blur(4px);
    }
    form textarea {
      min-height: 80px;
    }
    form button {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      background: linear-gradient(90deg,#8b5cff,#d46bff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 30px rgba(139,92,255,0.18);
    }
    form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(139,92,255,0.26);
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin: 6px 0 6px 2px;
      color: #efe6ff;
    }
    .hint-text {
      font-size: 0.95rem;
      color: #4a5568;
      background: rgba(25,118,210,0.04);
      border-left: 3px solid rgba(25,118,210,0.12);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0 14px 0;
    }
    .dark-theme .hint-text {
      color: #cbd5e1;
      background: rgba(255,255,255,0.02);
      border-left-color: rgba(255,255,255,0.06);
    }
    .form-message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      transition: transform 0.18s ease, opacity 0.18s ease;
      opacity: 0;
      transform: translateY(-6px);
    }
    .form-message.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    .form-message.error {
      background: linear-gradient(90deg,#fdecea,#f8d7da);
      border: 1px solid #f5c2c7;
      color: #611a15;
    }
    .form-message.success {
      background: linear-gradient(90deg,#e9f7ef,#d6f5e1);
      border: 1px solid #b7e4c7;
      color: #1b5e20;
    }
    .dark-theme .form-message.error {
      background: linear-gradient(90deg,#3a1f1f,#2b1919);
      border-color: #5a2a2a;
      color: #ffd6d6;
    }
    .dark-theme .form-message.success {
      background: linear-gradient(90deg,#153a1f,#102d16);
      border-color: #234d2b;
      color: #b8f0c6;
    }
    .review {
      border-radius: 14px;
      padding: 14px 18px;
      margin: 14px 0;
      position: relative;
      color: #fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 8px 30px rgba(86,0,160,0.12), 0 0 18px rgba(128,0,255,0.08) inset;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .review:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(86,0,160,0.18), 0 0 30px rgba(128,0,255,0.12) inset;
    }
    .review .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .review .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg,#7b2cff,#b77bff);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-shadow: 0 6px 18px rgba(123,44,255,0.28);
      flex: 0 0 44px;
      font-size: 0.95rem;
      user-select: none;
    }
    .review .meta .meta-text {
      flex: 1 1 auto;
    }
    .review strong {
      font-size: 1.05rem;
      display: block;
      margin-bottom: 2px;
      color: #fff;
    }
    .review .review-date {
      position: static;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.68);
      margin-left: 8px;
    }
    .review .message {
      margin-top: 6px;
      color: rgba(255,255,255,0.92);
      line-height: 1.5;
      font-size: 0.98rem;
    }
    .review img {
      max-width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .stars {
      color: #ffd15c;
      font-size: 1.25rem;
      margin-left: 6px;
      vertical-align: middle;
      user-select: none;
      display: inline-block;
      text-shadow: 0 2px 8px rgba(255,193,7,0.18);
      transition: transform 0.18s ease;
    }
    .stars:hover {
      transform: scale(1.12);
    }
    .review img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .stats {
      text-align: center;
      font-size: 1.1rem;
      margin: 20px 0 10px;
    }
    #themeToggle {
      margin: 10px auto;
      display: block;
      padding: 10px 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #themeToggle:hover {
      background-color: #333;
    }
    #goHome {
      margin: 10px auto;
      display: block;
      padding: 10px 16px;
      background-color: #888;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #goHome:hover {
      background-color: #666;
    }
    .dark-theme #goHome {
      background-color: #555;
    }
    .dark-theme #goHome:hover {
      background-color: #444;
    }
    .rating-bar {
      height: 12px;
      background-color: #ccc;
      border-radius: 6px;
      overflow: hidden;
      margin: 10px auto 20px;
      max-width: 420px;
    }
    .rating-fill {
      height: 100%;
      background: linear-gradient(90deg,#ffdd57,#ff9bff,#8b5cff);
      width: 0;
      transition: width 0.4s ease;
    }
    body.dark-theme {
      background-color: #121212;
      color: #eee;
    }
    .dark-theme .review {
      background: linear-gradient(180deg, rgba(24,4,34,0.7), rgba(8,2,18,0.7));
      border-color: rgba(255,255,255,0.04);
    }
    .dark-theme .rating-fill {
      background: linear-gradient(90deg,#ff9bff,#8b5cff);
    }
    .dark-theme form input,
    .dark-theme form textarea,
    .dark-theme form select {
      background-color: #1e1e1e;
      color: #eee;
      border-color: #444;
    }
    .dark-theme form button {
      background-color: #388e3c;
    }
    .dark-theme form button:hover {
      background-color: #2e7d32;
    }
    .dark-theme .rating-bar {
      background-color: #444;
    }
    .dark-theme .rating-fill {
      background-color: #fbc02d;
    }
    .admin-reply {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid rgba(139,92,255,0.9);
      background: linear-gradient(180deg, rgba(139,92,255,0.06), rgba(139,92,255,0.02));
      color: #fff;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      body { max-width: 96%; margin: 18px auto; padding: 12px; }
      h1, h2 { font-size: 1.25rem; }
      form input, form textarea, form select { font-size: 0.98rem; padding: 10px 12px; }
      form button { padding: 12px; font-size: 1rem; border-radius: 10px; }
      .rating-bar { max-width: 90%; }
      .review { padding: 12px 14px; }
      .review .avatar { width: 40px; height: 40px; flex: 0 0 40px; }
    }
    @media (max-width: 420px) {
      body { padding: 8px 12px 40px 12px; font-size: 15px; }
      h1 { font-size: 1.1rem; }
      form input, form textarea, form select { padding: 10px; font-size: 0.95rem; }
      form button { padding: 12px; font-size: 1rem; }
      .hint-text { font-size: 0.9rem; }
      .review { padding: 12px; border-radius: 12px; }
      .review .avatar { width: 36px; height: 36px; font-size: 0.85rem; }
      .stars { font-size: 1.05rem; }
      .stats { font-size: 1rem; }
      .rating-bar { width: 90%; max-width: 90%; height: 10px; }
      #goHome, #themeToggle { width: auto; padding: 8px 12px; font-size: 0.95rem; }
    }
    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .review {
      animation: fadeInUp 540ms cubic-bezier(.22,.9,.35,1) both;
      animation-delay: calc(var(--i, 0) * 80ms);
    }
    @keyframes pulseAvatar {
      0% { box-shadow: 0 6px 18px rgba(123,44,255,0.28); transform: translateY(0); }
      50% { box-shadow: 0 20px 40px rgba(139,92,255,0.16); transform: translateY(-2px); }
      100% { box-shadow: 0 6px 18px rgba(123,44,255,0.28); transform: translateY(0); }
    }
    .avatar { animation: pulseAvatar 3.6s ease-in-out infinite; }
    /* Add Review button (placed under rating filter) */
    .open-review-btn {
      display: block;
      margin: 14px auto;
      background: linear-gradient(90deg,#ff7bff,#8b5cff);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 14px 40px rgba(139,92,255,0.22), inset 0 -4px 20px rgba(255,123,200,0.06);
      cursor: pointer;
      font-weight: 700;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      max-width: 420px;
      width: calc(100% - 36px);
      -webkit-tap-highlight-color: transparent;
    }
    .open-review-btn:hover { transform: translateY(-3px); }
    .open-review-btn:active { transform: translateY(1px); }
    .open-review-btn.highlight { animation: pulseGlow 2.4s infinite; }
    @keyframes pulseGlow {
      0% { box-shadow: 0 14px 36px rgba(139,92,255,0.18), 0 0 0 0 rgba(139,92,255,0.08); }
      50% { box-shadow: 0 20px 56px rgba(139,92,255,0.28), 0 0 28px 6px rgba(139,92,255,0.06); }
      100% { box-shadow: 0 14px 36px rgba(139,92,255,0.18), 0 0 0 0 rgba(139,92,255,0.08); }
    }
    .modal { display: none; position: fixed; inset: 0; z-index: 1400; }
    .modal[aria-hidden="false"] { display: block; }
    .modal-backdrop {
      position: absolute; inset: 0; background: rgba(2,2,8,0.6);
      backdrop-filter: blur(6px);
      z-index: 1400;
    }
    .modal-content {
      position: absolute; left: 50%; top: 6%; transform: translateX(-50%);
      width: 94%; max-width: 720px; max-height: 88vh; overflow: auto;
      background: linear-gradient(180deg, rgba(10,6,18,0.96), rgba(6,3,10,0.98));
      border-radius: 14px; padding: 18px; padding-bottom: 36px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      z-index: 1401;
    }
    .modal-close { position: absolute; right: 12px; top: 12px; background: transparent; color: #fff; border: none; font-size: 1.1rem; cursor: pointer; }

    @media (max-width: 768px) {
      .open-review-btn { width: calc(100% - 24px); max-width: none; border-radius: 10px; }
      /* hide inline form on small screens to save space */
      #reviewForm { display: none; }
      /* BUT when modal is open, show the form inside modal */
      #reviewModal[aria-hidden="false"] #reviewForm { display: block !important; }
      .modal-content #reviewForm { display: block !important; }
    }

    /* mobile modal layout (bottom sheet) */
    @media (max-width: 420px) {
      .modal-content {
        position: fixed;
        left: 0; right: 0; bottom: 0; top: auto;
        transform: none;
        width: 100%; max-width: 100%; height: auto; max-height: calc(100vh - 40px);
        border-radius: 12px 12px 0 0; padding: 14px; box-sizing: border-box;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* ensure modal is above virtual keyboard and visible */
      .modal[aria-hidden="false"] { padding-bottom: env(safe-area-inset-bottom, 16px); }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">
  <h1>Залиште відгук</h1>

  <button id="themeToggle">🌗 Змінити тему</button>
  <a id="goHome" href="https://cannabanka.github.io/KanabisUkr420/">🏠 На головну</a>

  <form id="reviewForm">
    <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
    <div class="order-group">
      <label for="orderNumber" class="field-label">Номер замовлення</label>
      <input type="text" id="orderNumber" placeholder="Введіть номер замовлення" required autocomplete="off" />
      <label for="orderPin" class="field-label">PIN-код</label>
      <input type="password" id="orderPin" placeholder="Введіть PIN-код" required autocomplete="off" />
      <div class="hint-text">Номер замовлення та PIN-код ви отримуєте після оформлення замовлення.</div>
    </div>
    <input type="text" id="name" placeholder="Ваше ім'я" required autocomplete="name" />
    <label for="rating">Рейтинг (зірки):</label>
    <select id="rating" required>
      <option value="" disabled selected>Оберіть рейтинг</option>
      <option value="1">1 ★</option>
      <option value="2">2 ★★</option>
      <option value="3">3 ★★★</option>
      <option value="4">4 ★★★★</option>
      <option value="5">5 ★★★★★</option>
    </select>
    <textarea id="message" placeholder="Ваш відгук" required></textarea>
    <input type="url" id="photoUrl" placeholder="Посилання на фото (опціонально)" />
    <button type="submit">Надіслати</button>
  </form>

  <!-- Modal for form (moves the form element here on mobile) -->
  <div id="reviewModal" class="modal" role="dialog" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" id="modalContent">
      <button class="modal-close" id="modalClose" aria-label="Закрити">✖</button>
      <!-- form will be moved here dynamically -->
    </div>
  </div>

  <div class="stats" id="ratingStats"></div>
  <div class="rating-bar"><div class="rating-fill" id="ratingFill"></div></div>

  <label for="filterRating">Фільтрувати за рейтингом:</label>
  <select id="filterRating">
    <option value="all">Усі рейтинги</option>
    <option value="5">Тільки 5 ★</option>
    <option value="4">Тільки 4 ★</option>
    <option value="3">Тільки 3 ★</option>
    <option value="2">Тільки 2 ★</option>
    <option value="1">Тільки 1 ★</option>
  </select>

  <!-- Add Review button moved here to be under the rating filter -->
  <div style="text-align:center;">
    <button id="openReviewBtn" class="open-review-btn highlight" aria-label="Додати відгук">✍️ Додати відгук</button>
  </div>

  <h2>Відгуки</h2>
  <div id="approvedReviews"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUs_53Iek1mKi2GcJCduz2N-d_3kWHW3o",
      authDomain: "tets-c92b3.firebaseapp.com",
      databaseURL: "https://tets-c92b3-default-rtdb.firebaseio.com",
      projectId: "tets-c92b3",
      storageBucket: "tets-c92b3.appspot.com",
      messagingSenderId: "989700479323",
      appId: "1:989700479323:web:80387b013848a140c2a27e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const reviewForm = document.getElementById('reviewForm');
    const approvedReviewsDiv = document.getElementById('approvedReviews');
    const ratingStatsDiv = document.getElementById('ratingStats');
    const ratingFill = document.getElementById('ratingFill');
    const filterRating = document.getElementById('filterRating');

    reviewForm.addEventListener('submit', e => {
      e.preventDefault();
      // Перевірка номера замовлення та PIN (тільки один адмінський набір)
      const orderNumber = document.getElementById('orderNumber').value.trim();
      const orderPin = document.getElementById('orderPin').value.trim();
      // Задайте тут бажані адмін-креденшели
      const ADMIN_ORDER = '2008';
      const ADMIN_PIN = '4422';
      // Функція показу повідомлення у формі
      function showFormMessage(text, type = 'error') {
        const box = document.getElementById('formMessage');
        box.textContent = text;
        box.className = 'form-message ' + type + ' visible';
        // фокус на полі, якщо це помилка
        if (type === 'error') {
          document.getElementById('orderNumber').focus();
        }
        // Прибираємо повідомлення через 5 секунд
        clearTimeout(window._formMessageTimeout);
        window._formMessageTimeout = setTimeout(() => {
          box.classList.remove('visible');
        }, 5000);
      }

      if (orderNumber !== ADMIN_ORDER || orderPin !== ADMIN_PIN) {
        showFormMessage('❌ Невірний номер замовлення або PIN. Введіть коректні дані для додавання відгуку.', 'error');
        return;
      }
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const rating = parseInt(document.getElementById('rating').value);
      const photoUrl = document.getElementById('photoUrl').value.trim();
      if (!name || !message || !rating) {
        showFormMessage('⚠️ Будь ласка, заповніть всі поля, окрім фото.', 'error');
        return;
      }
      const newReviewRef = db.ref('reviews').push();
      newReviewRef.set({
        name,
        message,
        rating,
        photoUrl: photoUrl || null,
        // Оскільки лише адміністратор може додавати відгуки через цей інтерфейс,
        // ставимо відразу approved: true
        approved: true,
        timestamp: Date.now()
      });
      showFormMessage('✅ Дякуємо! Відгук додано та опубліковано.', 'success');
      reviewForm.reset();
    });

    function stars(count) {
      return '★'.repeat(count) + '☆'.repeat(5 - count);
    }

    // Повертає нормалізований URL (додає https:// якщо відсутній)
    function normalizeUrl(u) {
      if (!u) return '';
      u = u.trim();
      // Спробувати розпарсити стандартно
      try {
        const parsed = new URL(u, window.location.href);
        // Якщо це Google imgres redirect, беремо imgurl параметр
        const imgurl = parsed.searchParams.get('imgurl') || parsed.searchParams.get('img_url') || parsed.searchParams.get('mediaurl');
        if (imgurl) return decodeURIComponent(imgurl);
        // Якщо вже правильний протокол — повертаємо як є
        if (/^https?:\/\//i.test(u)) return u;
        return 'https://' + u;
      } catch (e) {
        // fallback: спробуємо витягти imgurl вручну
        const m = u.match(/[?&]imgurl=([^&]+)/);
        if (m) {
          try { return decodeURIComponent(m[1]); } catch (err) { return m[1]; }
        }
        if (!/^https?:\/\//i.test(u)) return 'https://' + u;
        return u;
      }
    }

    // Генерує градієнт для аватарки за іменем
    function avatarGradient(name) {
      const s = String(name || '').trim();
      let hash = 0;
      for (let i = 0; i < s.length; i++) {
        hash = (hash << 5) - hash + s.charCodeAt(i);
        hash |= 0;
      }
      const hue = Math.abs(hash) % 360;
      const h2 = (hue + 40) % 360;
      return `background: linear-gradient(135deg, hsl(${hue} 90% 55%), hsl(${h2} 85% 68%));`;
    }

    function getFormattedDate(timestamp) {
      const date = new Date(timestamp);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = String(date.getFullYear()).slice(-2);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function showApprovedReviews() {
      const filterValue = filterRating?.value || 'all';
      db.ref('reviews').orderByChild('approved').equalTo(true).on('value', snapshot => {
        approvedReviewsDiv.innerHTML = '';
        ratingStatsDiv.innerHTML = '';
        ratingFill.style.width = '0%';
        let totalRating = 0;
        let count = 0;
        const reviewsArray = [];

        snapshot.forEach(childSnapshot => {
          const review = childSnapshot.val();
          const passesFilter =
            filterValue === 'all' ||
            review.rating === parseInt(filterValue);
          if (passesFilter) {
            reviewsArray.push(review);
          }
        });

        // Сортування по даті: нові спочатку
        reviewsArray.sort((a, b) => b.timestamp - a.timestamp);

        reviewsArray.forEach((review, idx) => {
          totalRating += review.rating;
          count++;
          const div = document.createElement('div');
          const formattedDate = getFormattedDate(review.timestamp);
          // встановлюємо індекс для поетапної анімації
          div.style.setProperty('--i', idx);
          div.className = 'review';
          const initials = (review.name || '').split(' ').map(s=>s[0]||'').join('').slice(0,2).toUpperCase();
          const avatarStyle = avatarGradient(review.name);
          const photo = normalizeUrl(review.photoUrl || '');
          div.innerHTML = `
            <div class="meta">
              <div class="avatar" aria-hidden="true" style="${avatarStyle}">${initials || 'U'}</div>
              <div class="meta-text">
                <strong class="name">${review.name}</strong>
                <div class="stars" title="Рейтинг: ${review.rating}">${stars(review.rating)}</div>
              </div>
              <span class="review-date">${formattedDate}</span>
            </div>
            <p class="message">${review.message}</p>
            ${photo ? `<img src="${photo}" alt="Фото від ${review.name}" loading="lazy" onerror="this.style.display='none'" />` : ''}
            ${review.adminReply ? `<div class="admin-reply"><strong>Адміністратор:</strong><br>${review.adminReply}</div>` : ''}
          `;
          approvedReviewsDiv.appendChild(div);
        });

        if (count > 0) {
          const average = (totalRating / count).toFixed(1);
          ratingStatsDiv.innerHTML = `📊 Відгуків: <strong>${count}</strong> | Середній рейтинг: <strong>${average} ★</strong>`;
          const percent = (average / 5) * 100;
          ratingFill.style.width = `${percent}%`;
        } else {
          ratingStatsDiv.innerHTML = 'Немає відгуків для цього фільтру.';
        }
      });
    }

    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    });

    filterRating.addEventListener('change', showApprovedReviews);
    showApprovedReviews();

    // Modal logic: move the form into modal on open, and move back on close
    const openReviewBtn = document.getElementById('openReviewBtn');
    const reviewModal = document.getElementById('reviewModal');
    const modalContent = document.getElementById('modalContent');
    const modalClose = document.getElementById('modalClose');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const originalFormParent = reviewForm.parentNode;
    const originalNextSibling = reviewForm.nextSibling;

    function openModal() {
      // move form into modal
      if (!modalContent.contains(reviewForm)) {
        modalContent.appendChild(reviewForm);
      }
      reviewModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      // focus first input for accessibility
      setTimeout(() => { const f = reviewForm.querySelector('input, textarea, select'); if (f) f.focus(); }, 120);
      // On mobile ensure modal is visible (scroll into view) and move viewport if needed
      setTimeout(() => {
        try {
          modalContent.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // extra safe: scroll window to top on small screens
          if (window.innerWidth <= 420) window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {}
      }, 220);
    }

    function closeModal() {
      // move form back to original place (use original nextSibling if present)
      if (!originalFormParent.contains(reviewForm)) {
        try {
          if (originalNextSibling && originalNextSibling.parentNode === originalFormParent) {
            originalFormParent.insertBefore(reviewForm, originalNextSibling);
          } else {
            originalFormParent.appendChild(reviewForm);
          }
        } catch (err) {
          originalFormParent.appendChild(reviewForm);
        }
      }
      reviewModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    openReviewBtn?.addEventListener('click', openModal);
    modalClose?.addEventListener('click', closeModal);
    modalBackdrop?.addEventListener('click', closeModal);
    // close on Esc
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // Ensure form is moved back when resizing to large screens
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) {
        if (!originalFormParent.contains(reviewForm)) {
          try {
            if (originalNextSibling && originalNextSibling.parentNode === originalFormParent) {
              originalFormParent.insertBefore(reviewForm, originalNextSibling);
            } else {
              originalFormParent.appendChild(reviewForm);
            }
          } catch (err) {
            originalFormParent.appendChild(reviewForm);
          }
          reviewModal.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
        }
      }
    });

    // On mobile, keep the submit button visible: make it sticky inside modal
    // and scroll focused inputs into view.
    if (window.matchMedia('(max-width:420px)').matches) {
      reviewForm.addEventListener('focusin', (ev) => {
        const t = ev.target;
        setTimeout(() => {
          try {
            if (modalContent.contains(t)) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } catch (err) {}
        }, 160);
      });
    }

    // Make the submit button sticky inside modal for mobile
    const style = document.createElement('style');
    style.innerHTML = `
      @media (max-width:420px){
        #modalContent form button[type=submit]{
          position: sticky!important; bottom: 12px; z-index: 1400; display:block; width: calc(100% - 28px); margin: 8px auto 0 auto;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
