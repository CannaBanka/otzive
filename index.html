<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Відгуки</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      max-width: 760px;
      margin: 24px auto;
      padding: 0 18px 60px 18px;
      font-size: 16px;
      line-height: 1.5;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(118,33,255,0.12), transparent 8%), radial-gradient(800px 400px at 90% 90%, rgba(255,75,200,0.08), transparent 10%), #0b0710;
      color: #e9e6ef;
      transition: background 0.4s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #fff;
      text-shadow: 0 4px 18px rgba(128,0,255,0.12);
    }
    form input,
    form textarea,
    form select {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 15px 0;
      box-sizing: border-box;
      font-size: 1rem;
      border-radius: 8px;
      resize: vertical;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      color: #eee;
      backdrop-filter: blur(4px);
    }
    form textarea {
      min-height: 80px;
    }
    form button {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      background: linear-gradient(90deg,#8b5cff,#d46bff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 30px rgba(139,92,255,0.18);
    }
    form button:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(139,92,255,0.26);
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin: 6px 0 6px 2px;
      color: #efe6ff;
    }
    .hint-text {
      font-size: 0.95rem;
      color: #4a5568;
      background: rgba(25,118,210,0.04);
      border-left: 3px solid rgba(25,118,210,0.12);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0 14px 0;
    }
    .dark-theme .hint-text {
      color: #cbd5e1;
      background: rgba(255,255,255,0.02);
      border-left-color: rgba(255,255,255,0.06);
    }
    .form-message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      transition: transform 0.18s ease, opacity 0.18s ease;
      opacity: 0;
      transform: translateY(-6px);
    }
    .form-message.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    .form-message.error {
      background: linear-gradient(90deg,#fdecea,#f8d7da);
      border: 1px solid #f5c2c7;
      color: #611a15;
    }
    .form-message.success {
      background: linear-gradient(90deg,#e9f7ef,#d6f5e1);
      border: 1px solid #b7e4c7;
      color: #1b5e20;
    }
    .dark-theme .form-message.error {
      background: linear-gradient(90deg,#3a1f1f,#2b1919);
      border-color: #5a2a2a;
      color: #ffd6d6;
    }
    .dark-theme .form-message.success {
      background: linear-gradient(90deg,#153a1f,#102d16);
      border-color: #234d2b;
      color: #b8f0c6;
    }
    .review {
      border-radius: 14px;
      padding: 14px 18px;
      margin: 14px 0;
      position: relative;
      color: #fff;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 8px 30px rgba(86,0,160,0.12), 0 0 18px rgba(128,0,255,0.08) inset;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .review:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(86,0,160,0.18), 0 0 30px rgba(128,0,255,0.12) inset;
    }
    .review .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .review .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg,#7b2cff,#b77bff);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-shadow: 0 6px 18px rgba(123,44,255,0.28);
      flex: 0 0 44px;
      font-size: 0.95rem;
      user-select: none;
    }
    .review .meta .meta-text {
      flex: 1 1 auto;
    }
    .review strong {
      font-size: 1.05rem;
      display: block;
      margin-bottom: 2px;
      color: #fff;
    }
    .review .review-date {
      position: static;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.68);
      margin-left: 8px;
    }
    .review .message {
      margin-top: 6px;
      color: rgba(255,255,255,0.92);
      line-height: 1.5;
      font-size: 0.98rem;
    }
    .review img {
      max-width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .stars {
      color: #ffd15c;
      font-size: 1.25rem;
      margin-left: 6px;
      vertical-align: middle;
      user-select: none;
      display: inline-block;
      text-shadow: 0 2px 8px rgba(255,193,7,0.18);
      transition: transform 0.18s ease;
    }
    .stars:hover {
      transform: scale(1.12);
    }
    .review img {
      max-width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .stats {
      text-align: center;
      font-size: 1.1rem;
      margin: 20px 0 10px;
    }
    #themeToggle {
      margin: 10px auto;
      display: block;
      padding: 10px 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #themeToggle:hover {
      background-color: #333;
    }
    #goHome {
      margin: 10px auto;
      display: block;
      padding: 10px 16px;
      background-color: #888;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #goHome:hover {
      background-color: #666;
    }
    .dark-theme #goHome {
      background-color: #555;
    }
    .dark-theme #goHome:hover {
      background-color: #444;
    }
    .rating-bar {
      height: 12px;
      background-color: #ccc;
      border-radius: 6px;
      overflow: hidden;
      margin: 10px auto 20px;
      max-width: 420px;
    }
    .rating-fill {
      height: 100%;
      background: linear-gradient(90deg,#ffdd57,#ff9bff,#8b5cff);
      width: 0;
      transition: width 0.4s ease;
    }
    body.dark-theme {
      background-color: #121212;
      color: #eee;
    }
    .dark-theme .review {
      background: linear-gradient(180deg, rgba(24,4,34,0.7), rgba(8,2,18,0.7));
      border-color: rgba(255,255,255,0.04);
    }
    .dark-theme .rating-fill {
      background: linear-gradient(90deg,#ff9bff,#8b5cff);
    }
    .dark-theme form input,
    .dark-theme form textarea,
    .dark-theme form select {
      background-color: #1e1e1e;
      color: #eee;
      border-color: #444;
    }
    .dark-theme form button {
      background-color: #388e3c;
    }
    .dark-theme form button:hover {
      background-color: #2e7d32;
    }
    .dark-theme .rating-bar {
      background-color: #444;
    }
    .dark-theme .rating-fill {
      background-color: #fbc02d;
    }
    .admin-reply {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid rgba(139,92,255,0.9);
      background: linear-gradient(180deg, rgba(139,92,255,0.06), rgba(139,92,255,0.02));
      color: #fff;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      body { max-width: 96%; margin: 18px auto; padding: 12px; }
      h1, h2 { font-size: 1.25rem; }
      form input, form textarea, form select { font-size: 0.98rem; padding: 10px 12px; }
      form button { padding: 12px; font-size: 1rem; border-radius: 10px; }
      .rating-bar { max-width: 90%; }
      .review { padding: 12px 14px; }
      .review .avatar { width: 40px; height: 40px; flex: 0 0 40px; }
    }
    @media (max-width: 420px) {
      body { padding: 8px 12px 40px 12px; font-size: 15px; }
      h1 { font-size: 1.1rem; }
      form input, form textarea, form select { padding: 10px; font-size: 0.95rem; }
      form button { padding: 12px; font-size: 1rem; }
      .hint-text { font-size: 0.9rem; }
      .review { padding: 12px; border-radius: 12px; }
      .review .avatar { width: 36px; height: 36px; font-size: 0.85rem; }
      .stars { font-size: 1.05rem; }
      .stats { font-size: 1rem; }
      .rating-bar { width: 90%; max-width: 90%; height: 10px; }
      #goHome, #themeToggle { width: auto; padding: 8px 12px; font-size: 0.95rem; }
    }
    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .review {
      animation: fadeInUp 540ms cubic-bezier(.22,.9,.35,1) both;
      animation-delay: calc(var(--i, 0) * 80ms);
    }
    @keyframes pulseAvatar {
      0% { box-shadow: 0 6px 18px rgba(123,44,255,0.28); transform: translateY(0); }
      50% { box-shadow: 0 20px 40px rgba(139,92,255,0.16); transform: translateY(-2px); }
      100% { box-shadow: 0 6px 18px rgba(123,44,255,0.28); transform: translateY(0); }
    }
    .avatar { animation: pulseAvatar 3.6s ease-in-out infinite; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">
  <h1>Залиште відгук</h1>

  <button id="themeToggle">🌗 Змінити тему</button>
  <a id="goHome" href="https://cannabanka.github.io/KanabisUkr420/">🏠 На головну</a>

  <form id="reviewForm">
    <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
    <div class="order-group">
      <label for="orderNumber" class="field-label">Номер замовлення</label>
      <input type="text" id="orderNumber" placeholder="Введіть номер замовлення" required autocomplete="off" />
      <label for="orderPin" class="field-label">PIN-код</label>
      <input type="password" id="orderPin" placeholder="Введіть PIN-код" required autocomplete="off" />
      <div class="hint-text">Номер замовлення та PIN-код ви отримуєте після оформлення замовлення.</div>
    </div>
    <input type="text" id="name" placeholder="Ваше ім'я" required autocomplete="name" />
    <textarea id="message" placeholder="Ваш відгук" required></textarea>
    <label for="rating">Рейтинг (зірки):</label>
    <select id="rating" required>
      <option value="" disabled selected>Оберіть рейтинг</option>
      <option value="1">1 ★</option>
      <option value="2">2 ★★</option>
      <option value="3">3 ★★★</option>
      <option value="4">4 ★★★★</option>
      <option value="5">5 ★★★★★</option>
    </select>
    <input type="url" id="photoUrl" placeholder="Посилання на фото (опціонально)" />
    <button type="submit">Надіслати</button>
  </form>

  <div class="stats" id="ratingStats"></div>
  <div class="rating-bar"><div class="rating-fill" id="ratingFill"></div></div>

  <label for="filterRating">Фільтрувати за рейтингом:</label>
  <select id="filterRating">
    <option value="all">Усі рейтинги</option>
    <option value="5">Тільки 5 ★</option>
    <option value="4">Тільки 4 ★</option>
    <option value="3">Тільки 3 ★</option>
    <option value="2">Тільки 2 ★</option>
    <option value="1">Тільки 1 ★</option>
  </select>

  <h2>Відгуки</h2>
  <div id="approvedReviews"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUs_53Iek1mKi2GcJCduz2N-d_3kWHW3o",
      authDomain: "tets-c92b3.firebaseapp.com",
      databaseURL: "https://tets-c92b3-default-rtdb.firebaseio.com",
      projectId: "tets-c92b3",
      storageBucket: "tets-c92b3.appspot.com",
      messagingSenderId: "989700479323",
      appId: "1:989700479323:web:80387b013848a140c2a27e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const reviewForm = document.getElementById('reviewForm');
    const approvedReviewsDiv = document.getElementById('approvedReviews');
    const ratingStatsDiv = document.getElementById('ratingStats');
    const ratingFill = document.getElementById('ratingFill');
    const filterRating = document.getElementById('filterRating');

    reviewForm.addEventListener('submit', e => {
      e.preventDefault();
      // Перевірка номера замовлення та PIN (тільки один адмінський набір)
      const orderNumber = document.getElementById('orderNumber').value.trim();
      const orderPin = document.getElementById('orderPin').value.trim();
      // Задайте тут бажані адмін-креденшели
      const ADMIN_ORDER = '2008';
      const ADMIN_PIN = '4422';
      // Функція показу повідомлення у формі
      function showFormMessage(text, type = 'error') {
        const box = document.getElementById('formMessage');
        box.textContent = text;
        box.className = 'form-message ' + type + ' visible';
        // фокус на полі, якщо це помилка
        if (type === 'error') {
          document.getElementById('orderNumber').focus();
        }
        // Прибираємо повідомлення через 5 секунд
        clearTimeout(window._formMessageTimeout);
        window._formMessageTimeout = setTimeout(() => {
          box.classList.remove('visible');
        }, 5000);
      }

      if (orderNumber !== ADMIN_ORDER || orderPin !== ADMIN_PIN) {
        showFormMessage('❌ Невірний номер замовлення або PIN. Введіть коректні дані для додавання відгуку.', 'error');
        return;
      }
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      const rating = parseInt(document.getElementById('rating').value);
      const photoUrl = document.getElementById('photoUrl').value.trim();
      if (!name || !message || !rating) {
        showFormMessage('⚠️ Будь ласка, заповніть всі поля, окрім фото.', 'error');
        return;
      }
      const newReviewRef = db.ref('reviews').push();
      newReviewRef.set({
        name,
        message,
        rating,
        photoUrl: photoUrl || null,
        // Оскільки лише адміністратор може додавати відгуки через цей інтерфейс,
        // ставимо відразу approved: true
        approved: true,
        timestamp: Date.now()
      });
      showFormMessage('✅ Дякуємо! Відгук додано та опубліковано.', 'success');
      reviewForm.reset();
    });

    function stars(count) {
      return '★'.repeat(count) + '☆'.repeat(5 - count);
    }

    function getFormattedDate(timestamp) {
      const date = new Date(timestamp);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = String(date.getFullYear()).slice(-2);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function showApprovedReviews() {
      const filterValue = filterRating?.value || 'all';
      db.ref('reviews').orderByChild('approved').equalTo(true).on('value', snapshot => {
        approvedReviewsDiv.innerHTML = '';
        ratingStatsDiv.innerHTML = '';
        ratingFill.style.width = '0%';
        let totalRating = 0;
        let count = 0;
        const reviewsArray = [];

        snapshot.forEach(childSnapshot => {
          const review = childSnapshot.val();
          const passesFilter =
            filterValue === 'all' ||
            review.rating === parseInt(filterValue);
          if (passesFilter) {
            reviewsArray.push(review);
          }
        });

        // Сортування по даті: нові спочатку
        reviewsArray.sort((a, b) => b.timestamp - a.timestamp);

        reviewsArray.forEach((review, idx) => {
          totalRating += review.rating;
          count++;
          const div = document.createElement('div');
          const formattedDate = getFormattedDate(review.timestamp);
          // встановлюємо індекс для поетапної анімації
          div.style.setProperty('--i', idx);
          div.className = 'review';
          const initials = (review.name || '').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
          div.innerHTML = `
            <div class="meta">
              <div class="avatar" aria-hidden="true">${initials || 'U'}</div>
              <div class="meta-text">
                <strong class="name">${review.name}</strong>
                <div class="stars" title="Рейтинг: ${review.rating}">${stars(review.rating)}</div>
              </div>
              <span class="review-date">${formattedDate}</span>
            </div>
            <p class="message">${review.message}</p>
            ${review.photoUrl ? `<img src="${review.photoUrl}" alt="Фото від ${review.name}" />` : ''}
            ${review.adminReply ? `<div class="admin-reply"><strong>Адміністратор:</strong><br>${review.adminReply}</div>` : ''}
          `;
          approvedReviewsDiv.appendChild(div);
        });

        if (count > 0) {
          const average = (totalRating / count).toFixed(1);
          ratingStatsDiv.innerHTML = `📊 Відгуків: <strong>${count}</strong> | Середній рейтинг: <strong>${average} ★</strong>`;
          const percent = (average / 5) * 100;
          ratingFill.style.width = `${percent}%`;
        } else {
          ratingStatsDiv.innerHTML = 'Немає відгуків для цього фільтру.';
        }
      });
    }

    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    });

    filterRating.addEventListener('change', showApprovedReviews);
    showApprovedReviews();
  </script>
</body>
</html>
